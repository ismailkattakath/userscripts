# Generated by repo-kit (repoKit.dependabot or lib.dependabot); change those options, not this file.
# github-actions: weekly, one grouped PR, a 7-day cooldown (a supply-chain hold), on /
# plus each composite action with its own uses: (the directories option).
---
updates:
- commit-message:
    prefix: ci
  cooldown:
    default-days: 7
  directories:
  - /
  groups:
    github-actions:
      patterns:
      - '*'
  package-ecosystem: github-actions
  schedule:
    interval: weekly
- commit-message:
    prefix: deps
  cooldown:
    default-days: 7
  directory: /
  groups:
    lint-tooling:
      patterns:
      - eslint
      - eslint-*
  open-pull-requests-limit: 3
  package-ecosystem: npm
  schedule:
    interval: monthly
version: 2
