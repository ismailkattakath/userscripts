name: automerge

# Every pull request in this repository is opened and merged by the
# ismailkattakath-ci GitHub App, never by a personal account:
#
#   git push origin <branch>      -> the bot opens the pull request
#   dependabot opens a PR          -> as before
#   checks go green                -> the bot merges (squash), branch deleted
#
# Eligibility for auto-merge is therefore simply "authored by one of the two
# bots". author_association could not be used (a member whose org membership
# is private is reported as CONTRIBUTOR) and repository_owner is the org
# name, never a login.
#
# pull_request_target, not pull_request: dependabot's PRs run `pull_request`
# with a read-only token and NO repository secrets, so the app credentials
# would be unreachable. pull_request_target runs in the base branch's context
# with secrets. That is safe here because nothing from the PR is checked out
# or executed - the job only asks GitHub to open or arm a pull request.
#
# push to main, the daily schedule and workflow_dispatch SWEEP every open
# eligible PR, so nothing can sit mergeable with nobody to arm it.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: ['**']
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - run: |
          set -eu
          eligible() {
            case "$1" in 'dependabot[bot]'|"$BOT") return 0 ;; *) return 1 ;; esac
          }
          arm() {
            echo "arming $1"
            gh pr merge --auto --squash "$1" || echo "  (skipped: $1)"
          }

          # A push to a branch other than main: open the pull request as the
          # bot if there is none yet. Dependabot's branches are its own.
          if [ "$EVENT" = "push" ] && [ "$REF_NAME" != "main" ]; then
            case "$REF_NAME" in dependabot/*) exit 0 ;; esac
            open=$(gh pr list --repo "$REPO" --head "$REF_NAME" --state open --json number --jq 'length')
            if [ "$open" != "0" ]; then echo "PR already open for $REF_NAME"; exit 0; fi
            msg=$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message')
            title=$(printf '%s\n' "$msg" | sed -n '1p')
            body=$(printf '%s\n' "$msg" | sed '1,2d')
            gh pr create --repo "$REPO" --head "$REF_NAME" --base main --title "$title" --body "$body"
            exit 0   # the resulting pull_request_target event arms it
          fi

          if [ "$EVENT" = "pull_request_target" ]; then
            [ "$PR_DRAFT" = "false" ] || exit 0
            eligible "$PR_AUTHOR" || { echo "not eligible: $PR_AUTHOR"; exit 0; }
            arm "$PR_URL"
            exit 0
          fi

          # Sweep (push to main, schedule, dispatch).
          gh api "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.draft == false) | "\(.user.login) \(.html_url)"' \
          | while read -r author url; do
              eligible "$author" || { echo "not eligible: $author $url"; continue; }
              arm "$url"
            done
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
