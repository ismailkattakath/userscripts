name: arm-dependabot

# Thin caller of the shared kattakath/.github arm-dependabot workflow: arms
# auto-merge on open Dependabot PRs from a schedule, or (since v1.0.2) merges one
# directly when it is already CLEAN, since this personal-account repo has no
# merge queue and GitHub refuses to arm a clean PR. A Dependabot-triggered run
# gets only Dependabot secrets, so the CI App key is unreachable there; a
# scheduled run keeps Actions secrets.
on:
  schedule:
    - cron: "41 */6 * * *"   # off the hour: GitHub delays and drops runs at peak
  workflow_dispatch:
concurrency:
  group: arm-dependabot
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: read
jobs:
  arm:
    uses: kattakath/.github/.github/workflows/arm-dependabot.yml@a605631adbddd3bc935eda81ff2107f3616b40c6 # v1.0.2
    with:
      client-id: ${{ vars.CI_BOT_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
